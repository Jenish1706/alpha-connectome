# The candidate for scripts/run_experiment.py. Each iteration starts from the
# champion's configuration (this file as committed) and changes one thing.
name: A1-full-data-2ep
description: Axis 1. Fit all 10,479 training sequences (6,607 streamed from the archive) for 2 epochs, cosine 2e-4 to 1e-5.
seed: 0
init: baseline        # baseline = warm start from the starter pack ONNX; scratch = random init
features: []          # names from src/features.py FEATURES, appended to the 112 raw inputs
model:
  hidden: 128
  layers: 2
  tanh_tau: 8.0      # output = 2 tanh(z / tanh_tau)
train:
  epochs: 2           # passes over the fitting sequences; 0 scores the initial weights
  batch_sequences: 256
  chunk: 250          # truncated-BPTT window
  lr: 2.0e-4
  min_lr: 1.0e-5      # floor of the cosine schedule
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 20
  loss: hybrid
  full_data: true     # also fit the 6,607 sequences past the sample, streamed from the archive
  fit_sequences: 3872 # sample row groups 0..3871 are fitted
  holdout: 128        # row groups 3872..3999: a diagnostic, never used for selection
  eval_every: 8       # holdout evaluations every N sequence batches
