# The candidate for scripts/run_experiment.py. Each iteration starts from the
# champion's configuration (this file as committed) and changes one thing.
name: T2.2c-tanh-tau4
description: Test 2.2c. Tanh clamp temperature tau = 4 instead of 2 (slope 0.5 at 0, nearly linear in range).
seed: 0
init: baseline        # baseline = warm start from the starter pack ONNX; scratch = random init
features: []          # names from src/features.py FEATURES, appended to the 112 raw inputs
model:
  hidden: 128
  layers: 2
  tanh_tau: 4.0      # output = 2 tanh(z / tanh_tau)
train:
  epochs: 1           # passes over the fitting sequences; 0 scores the initial weights
  batch_sequences: 256
  chunk: 250          # truncated-BPTT window
  lr: 2.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  warmup_steps: 20
  loss: hybrid
  fit_sequences: 3872 # sample row groups 0..3871 are fitted
  holdout: 128        # row groups 3872..3999: a diagnostic, never used for selection
  eval_every: 4       # holdout evaluations every N sequence batches
